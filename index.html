<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签约主体原型 — 统一导航</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
    }

    /* ===== 左侧导航 ===== */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #1f2d3d;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }
    .sidebar-header .sub {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 6px;
    }
    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }
    .nav-group {
      margin-bottom: 8px;
    }
    .nav-group-title {
      padding: 12px 20px 6px;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .nav-item {
      display: block;
      padding: 12px 20px 12px 28px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.05);
      color: #fff;
    }
    .nav-item.active {
      background: rgba(64,158,255,0.12);
      color: #409eff;
      border-left-color: #409eff;
    }
    .nav-item .desc {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 2px;
      line-height: 1.4;
    }
    .nav-item.active .desc { color: rgba(64,158,255,0.7); }
    .sidebar-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: #94a3b8;
    }

    /* ===== 右侧内容区 ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
      min-width: 0;
    }
    .topbar {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid #e4e7ed;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 15px;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .topbar .current-title { font-weight: 500; }
    .topbar .current-url {
      margin-left: auto;
      font-size: 13px;
      color: #409eff;
      text-decoration: none;
    }
    .iframe-wrap {
      flex: 1;
      position: relative;
      padding: 16px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>签约主体原型</h1>
      <div class="sub">多主体签约流程与协议确认</div>
    </div>
    <nav class="nav-list">
      <div class="nav-group">
        <div class="nav-group-title">方案一：联动提示</div>
        <a class="nav-item active" href="#" data-url="supplement-info.html" data-title="方案一 · 补充信息">
          补充信息页
          <span class="desc">填写机构信息、费率，跳转方案一签约主体</span>
        </a>
        <a class="nav-item" href="#" data-url="sign-entity.html" data-title="方案一 · 签约主体选择">
          签约主体选择页
          <span class="desc">随行付单独提醒、双选展示四份协议说明</span>
        </a>
        <a class="nav-item" href="#" data-url="csp-sign-confirm.html" data-title="方案一 · CSP签署协议确认">
          CSP签署协议确认页
          <span class="desc">双主体协议分组 + 费率表 + 立即签约弹窗</span>
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">方案二：自动同步勾选</div>
        <a class="nav-item" href="#" data-url="supplement-info-v2.html" data-title="方案二 · 补充信息">
          补充信息页
          <span class="desc">同方案一页面，跳转方案二签约主体</span>
        </a>
        <a class="nav-item" href="#" data-url="sign-entity-v2.html" data-title="方案二 · 签约主体选择">
          签约主体选择页
          <span class="desc">选择随行付时自动同步勾选天阙</span>
        </a>
        <a class="nav-item" href="#" data-url="csp-sign-confirm.html" data-title="方案二 · CSP签署协议确认">
          CSP签署协议确认页
          <span class="desc">双主体协议分组 + 费率表 + 立即签约弹窗</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      GitHub Pages · Gaohailinga/sign-entity-prototype
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="current-title" id="currentTitle">方案一 · 补充信息</span>
      <a class="current-url" id="currentUrl" href="supplement-info.html" target="_blank">新窗口打开</a>
    </div>
    <div class="iframe-wrap">
      <iframe id="protoFrame" src="supplement-info.html" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    var items = document.querySelectorAll('.nav-item');
    var frame = document.getElementById('protoFrame');
    var titleEl = document.getElementById('currentTitle');
    var urlEl = document.getElementById('currentUrl');

    items.forEach(function (item) {
      item.addEventListener('click', function (e) {
        e.preventDefault();
        var url = item.dataset.url;
        var title = item.dataset.title;

        items.forEach(function (i) { i.classList.remove('active'); });
        item.classList.add('active');

        frame.src = url;
        titleEl.textContent = title;
        urlEl.href = url;
      });
    });
  </script>
</body>
</html>
