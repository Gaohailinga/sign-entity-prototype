<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>费率修改</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; padding: 24px; }
  .container { max-width: 1000px; margin: 0 auto; }
  .page-header { margin-bottom: 24px; }
  .page-title { font-size: 20px; font-weight: 600; color: #303133; margin-bottom: 8px; }
  .page-desc { font-size: 14px; color: #909399; }
  .info-card { background: #fff; border-radius: 8px; padding: 20px 24px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 24px; font-size: 14px; }
  .info-item { display: flex; align-items: center; gap: 8px; }
  .info-label { color: #909399; }
  .info-value { color: #303133; font-weight: 500; }
  .summary-bar { background: #ecf5ff; border-left: 4px solid #409eff; padding: 12px 16px; border-radius: 4px; margin-bottom: 20px; font-size: 14px; color: #606266; }
  .summary-bar strong { color: #409eff; }
  .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
  .card-title { font-size: 16px; font-weight: 600; color: #303133; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }
  .rate-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; min-width: 640px; }
  .rate-table th, .rate-table td { border: 1px solid #ebeef5; padding: 14px 12px; }
  .rate-table th { background: #fafafa; color: #303133; font-weight: 600; }
  .rate-table td { color: #606266; }
  .rate-table .pay-type { font-weight: 500; color: #303133; background: #fafafa; }
  .rate-table .old-value { color: #909399; }
  .rate-table .new-value { color: #409eff; font-weight: 600; background: #f0f7ff; }
  .rate-table .mode-cell { text-align: left; max-width: 220px; }
  .change-tag { display: inline-block; font-size: 12px; color: #409eff; background: #ecf5ff; padding: 2px 8px; border-radius: 3px; margin-left: 6px; }
  .action-bar { display: flex; justify-content: center; gap: 16px; padding: 10px 0 30px; }
  .btn { min-width: 120px; height: 40px; line-height: 40px; border-radius: 4px; font-size: 14px; cursor: pointer; border: 1px solid transparent; text-align: center; }
  .btn-default { background: #fff; border-color: #dcdfe6; color: #606266; }
  .btn-default:hover { border-color: #409eff; color: #409eff; }
  .btn-primary { background: #409eff; color: #fff; border: none; }
  .btn-primary:hover { background: #66b1ff; }
  .btn-primary:disabled { background: #a0cfff; cursor: not-allowed; }
  .toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; padding: 12px 24px; border-radius: 4px; font-size: 14px; display: none; z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  .toast.show { display: block; }
  @media (max-width: 768px) {
    body { padding: 16px; }
    .info-card { flex-direction: column; gap: 12px; }
    .rate-table th, .rate-table td { padding: 10px 8px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <div class="page-title">费率修改</div>
    <div class="page-desc">请核对本次费率变更内容，确认无误后提交</div>
  </div>

  <div class="info-card">
    <div class="info-item">
      <span class="info-label">机构名称：</span>
      <span class="info-value">宁乡市一瓢饮食品商行</span>
    </div>
    <div class="info-item">
      <span class="info-label">变更单号：</span>
      <span class="info-value">RATE202611170001</span>
    </div>
    <div class="info-item">
      <span class="info-label">生效时间：</span>
      <span class="info-value">审核通过后次日</span>
    </div>
  </div>

  <div class="summary-bar">
    本次共变更 <strong>2 个支付类型</strong>、<strong>5 项费率</strong>；未变更的支付类型及费率项不在本页展示。
  </div>

  <div class="card">
    <div class="card-title">费率修改前后对比</div>
    <div class="table-wrap">
      <table class="rate-table">
        <thead>
          <tr>
            <th style="width:120px">支付类型</th>
            <th>费率模式</th>
            <th style="width:120px">费率项</th>
            <th style="width:140px">修改前</th>
            <th style="width:140px">修改后</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td rowspan="2" class="pay-type">微信支付</td>
            <td rowspan="2" class="mode-cell">扫码、公众号、小程序支付（线下）</td>
            <td>借记卡</td>
            <td class="old-value">0.23%</td>
            <td class="new-value">0.28%<span class="change-tag">调升</span></td>
          </tr>
          <tr>
            <td>贷记卡</td>
            <td class="old-value">0.23%</td>
            <td class="new-value">0.28%<span class="change-tag">调升</span></td>
          </tr>
          <tr>
            <td rowspan="3" class="pay-type">刷卡</td>
            <td rowspan="3" class="mode-cell">—</td>
            <td>借记卡</td>
            <td class="old-value">0.435%</td>
            <td class="new-value">0.45%<span class="change-tag">调升</span></td>
          </tr>
          <tr>
            <td>借记卡封顶</td>
            <td class="old-value">18.75元/笔</td>
            <td class="new-value">20元/笔<span class="change-tag">调升</span></td>
          </tr>
          <tr>
            <td>贷记卡</td>
            <td class="old-value">0.535%</td>
            <td class="new-value">0.55%<span class="change-tag">调升</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn btn-default" id="backBtn">返回</button>
    <button class="btn btn-primary" id="confirmBtn">确认修改</button>
  </div>
</div>

<div class="toast" id="toast">费率修改已确认（原型演示）</div>

<script>
  document.getElementById('backBtn').addEventListener('click', function () {
    history.back();
  });
  document.getElementById('confirmBtn').addEventListener('click', function () {
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    this.disabled = true;
    this.textContent = '已确认';
    setTimeout(function () { toast.classList.remove('show'); }, 2500);
  });
</script>
</body>
</html>
