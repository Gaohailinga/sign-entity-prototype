<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>费率信息变更</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; padding: 24px; }
  .container { max-width: 1000px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 16px; color: #333; }
  .header .welcome { font-weight: 500; }
  .header .manager { color: #666; }
  .header .manager strong { color: #333; font-weight: 500; }
  .steps { display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 8px; padding: 32px 20px; margin-bottom: 20px; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666; }
  .step .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #c0c4cc; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; }
  .step.active { color: #409eff; font-weight: 500; }
  .step.active .dot { border-color: #409eff; background: #409eff; color: #fff; }
  .step.done { color: #409eff; }
  .step.done .dot { border-color: #409eff; background: #fff; color: #409eff; }
  .step.done .dot::after { content: "✓"; font-size: 14px; font-weight: 700; }
  .step-line { width: 80px; height: 1px; background: #d9d9d9; margin: 0 12px; }
  .card { background: #fff; border-radius: 8px; padding: 28px; margin-bottom: 20px; }
  .card-title { font-size: 16px; font-weight: 600; color: #333; text-align: center; margin-bottom: 20px; }
  .agreement-desc { color: #606266; font-size: 13px; line-height: 1.8; text-align: center; }
  .agreement-desc a { color: #409eff; text-decoration: none; margin: 0 3px; }
  .agreement-desc a:hover { text-decoration: underline; }
  .fee-title { font-size: 16px; font-weight: 600; color: #303133; text-align: left; margin-bottom: 8px; }
  .rate-note { color: #909399; font-size: 13px; margin-bottom: 16px; }
  .fee-groups { display: flex; flex-direction: column; gap: 12px; }
  .fee-group { border: 1px solid #e4e7ed; border-radius: 3px; overflow: hidden; background: #fff; }
  .fee-group-header { width: 100%; height: 44px; padding: 0 20px; border: 0; background: #fafafa; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: #303133; text-align: left; }
  .fee-group-header:hover { background: #f5f7fa; }
  .fee-group-header[aria-expanded="true"] { border-bottom: 1px solid #e4e7ed; }
  .fee-group-content { padding: 26px; overflow-x: auto; }
  .fee-group-content[hidden] { display: none; }
  .toggle-control { display: inline-flex; align-items: center; gap: 14px; color: #606266; font-size: 13px; font-weight: 400; flex: none; }
  .chevron { width: 8px; height: 8px; border-right: 1.5px solid #606266; border-bottom: 1.5px solid #606266; transform: rotate(45deg); margin-top: -4px; }
  .fee-group-header[aria-expanded="true"] .chevron { transform: rotate(225deg); margin-top: 4px; }
  .rate-table { width: 100%; min-width: 600px; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
  .rate-table th, .rate-table td { border: 1px solid #e5e7eb; padding: 13px 18px; height: 52px; vertical-align: middle; text-align: center; }
  .rate-table th { background: #fafafa; color: #303133; font-weight: 600; }
  .rate-table td { color: #606266; font-variant-numeric: tabular-nums; }
  .product-name { color: #303133; overflow-wrap: anywhere; }
  .before-value { color: #909399; }
  .after-value { color: #409eff; font-weight: 600; background: #f0f7ff; }
  .action-bar { display: flex; justify-content: center; gap: 16px; padding: 10px 0 30px; }
  .btn { min-width: 160px; height: 42px; border-radius: 4px; font-size: 15px; cursor: pointer; }
  .btn-default { border: 1px solid #dcdfe6; background: #fff; color: #606266; }
  .btn-default:hover { border-color: #409eff; color: #409eff; }
  .btn-primary { border: 1px solid #409eff; background: #409eff; color: #fff; }
  .btn-primary:hover { background: #66b1ff; }
  .btn-primary:disabled { background: #a0cfff; border-color: #a0cfff; cursor: not-allowed; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; padding: 12px 24px; border-radius: 4px; font-size: 14px; display: none; z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  .toast.show { display: block; }
  @media (max-width: 768px) {
    body { padding: 16px; }
    .step-line { width: 30px; margin: 0 6px; }
    .rate-table { font-size: 12px; }
    .rate-table th, .rate-table td { padding: 10px 12px; }
    .fee-group-header { padding: 0 14px; }
    .fee-group-content { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="welcome">欢迎加入天阙会生活！</div>
    <div class="manager">您的合作经理：<strong>测试-BD1</strong></div>
  </div>
  <div class="steps">
    <div class="step done"><span class="dot"></span>注册账号</div>
    <div class="step-line"></div>
    <div class="step done"><span class="dot"></span>填写资料</div>
    <div class="step-line"></div>
    <div class="step done"><span class="dot"></span>信息审核</div>
    <div class="step-line"></div>
    <div class="step active"><span class="dot">4</span>签署协议</div>
  </div>
  <div class="card">
    <div class="card-title">签署协议——线上电子签约，完成后可下载电子协议，快速方便</div>
    <div class="agreement-desc">由于贵司费率信息变更，<a href="#">《补充协议》</a><a href="#">《国际银行卡收单服务协议》</a>需重新签署</div>
  </div>
  <div class="card">
    <div class="fee-title">费率信息</div>
    <div class="rate-note">仅展示本次发生变更的产品类型及费率项，未变更内容不展示</div>
    <div class="fee-groups" id="feeGroups"></div>
  </div>
  <div class="action-bar">
    <button class="btn btn-default" id="backBtn">返回</button>
    <button class="btn btn-primary" id="confirmBtn">确认并签约</button>
  </div>
</div>

<div class="toast" id="toast">费率信息已确认，可前往签约（原型演示）</div>
<script>
  var feeGroupData = [
    {
      id: 'scanRates', title: '扫码收款签约费率',
      rows: [
        ['微信', '借记卡', '0.23%', '0.28%'],
        ['微信', '贷记卡', '0.23%', '0.28%'],
        ['支付宝支付（白条分期）', '借记卡', '0.38%', '0.45%'],
        ['支付宝支付（白条分期）', '贷记卡', '0.38%', '0.45%']
      ]
    },
    {
      id: 'bankCardRates', title: '银行卡收款签约费率',
      rows: [
        ['刷卡', '借记卡', '0.435%', '0.45%'],
        ['刷卡', '借记卡封顶', '18.75元/笔', '20元/笔'],
        ['刷卡', '贷记卡', '0.535%', '0.55%']
      ]
    },
    { id: 'onlineRates', title: '线上场景收款签约费率', rows: [] },
    { id: 'smartMarketingRates', title: '智慧营销收款签约费率', rows: [] },
    {
      id: 'specialRates', title: '特殊行业签约费率',
      rows: [
        ['微信（缴费类）', '借记卡', '0.10%', '0.20%'],
        ['微信（缴费类）', '贷记卡', '0.10%', '0.20%']
      ]
    },
    {
      id: 'campaignRates', title: '营销活动签约费率',
      rows: [
        ['微信支付', '借记卡', '0.38%', '0.35%'],
        ['微信支付', '贷记卡', '0.38%', '0.35%']
      ]
    },
    { id: 'foreignRates', title: '外卡收款签约费率', rows: [] },
    { id: 'foreignSpecialRates', title: '外卡特殊费率', rows: [] },
    {
      id: 'valueAddedRates', title: '增值产品签约费率',
      rows: [
        ['D0自动-定时到账', '费率', '0.004', '0.005']
      ]
    }
  ];
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char];
    });
  }
  function renderFeeGroups() {
    var visibleFeeGroups = feeGroupData.filter(function (group) {
      return Array.isArray(group.rows) && group.rows.some(function (row) {
        var productType = row[0];
        return productType !== undefined && productType !== null && String(productType).trim() !== '';
      });
    });
    document.getElementById('feeGroups').innerHTML = visibleFeeGroups.map(function (group) {
      var bodyRows = group.rows.map(function (row) {
        return '<tr>' + row.map(function (cell, cellIndex) {
          var className = cellIndex === 0 ? 'product-name' : cellIndex === 2 ? 'before-value' : cellIndex === 3 ? 'after-value' : '';
          return '<td' + (className ? ' class="' + className + '"' : '') + '>' + escapeHtml(cell) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return '<section class="fee-group">' +
        '<button type="button" class="fee-group-header collapsible" data-target="' + group.id + '" aria-expanded="true" aria-controls="' + group.id + '">' +
          escapeHtml(group.title) + '<span class="toggle-control"><span class="toggle-text">收起</span><span class="chevron"></span></span>' +
        '</button>' +
        '<div class="fee-group-content" id="' + group.id + '">' +
          '<table class="rate-table"><colgroup><col style="width:28%"><col style="width:24%"><col style="width:24%"><col style="width:24%"></colgroup>' +
            '<thead><tr><th>产品类型</th><th>费率项</th><th>变更前</th><th>变更后</th></tr></thead>' +
            '<tbody>' + bodyRows + '</tbody>' +
          '</table>' +
        '</div>' +
      '</section>';
    }).join('');
  }
  renderFeeGroups();
  document.querySelectorAll('.collapsible').forEach(function (el) {
    el.addEventListener('click', function () {
      var target = document.getElementById(this.getAttribute('data-target'));
      var isExpanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!isExpanded));
      target.hidden = isExpanded;
      this.querySelector('.toggle-text').textContent = isExpanded ? '展示' : '收起';
    });
  });
  document.getElementById('backBtn').addEventListener('click', function () { history.back(); });
  document.getElementById('confirmBtn').addEventListener('click', function () {
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    this.disabled = true;
    this.textContent = '已确认';
    setTimeout(function () { toast.classList.remove('show'); }, 2500);
  });
</script>
</body>
</html>
