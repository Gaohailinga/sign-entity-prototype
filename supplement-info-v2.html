<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>补充信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f7f7f7;
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    background: #f7f7f7;
    display: flex;
    flex-direction: column;
    position: relative;
    padding-bottom: 40px;
  }

  /* ===== 状态栏（白底黑字） ===== */
  .status-bar {
    background: #fff;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 17px;
    font-weight: 700;
    color: #000;
  }
  .status-right { display: flex; align-items: center; gap: 6px; }
  .battery-num {
    background: #0a0a0a;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    border-radius: 5px;
    padding: 1px 5px;
    line-height: 16px;
  }

  /* ===== 导航栏（白底） ===== */
  .nav-bar {
    background: #fff;
    height: 48px;
    display: flex;
    align-items: center;
    position: relative;
  }
  .nav-back {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: absolute;
    left: 0;
  }
  .nav-title {
    width: 100%;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    color: #000;
  }

  /* ===== 分组 ===== */
  .section { margin-top: 10px; }
  .section-head {
    display: flex;
    align-items: center;
    padding: 14px 16px 10px;
  }
  .section-head .bar {
    width: 3px;
    height: 14px;
    background: #10ae71;
    border-radius: 2px;
    margin-right: 8px;
  }
  .section-head .title {
    font-size: 16px;
    font-weight: 600;
    color: #000;
  }
  .section-head .extra {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-head .extra .text { font-size: 15px; color: #000; }

  /* 绿色开关 */
  .switch {
    width: 48px;
    height: 28px;
    border-radius: 14px;
    background: #07c160;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    right: 2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .switch.off { background: #e5e5e5; }
  .switch.off::after { transform: translateX(-20px); }

  /* ===== 表单卡片 ===== */
  .card { background: #fff; }
  .form-row {
    display: flex;
    align-items: center;
    min-height: 54px;
    padding: 10px 16px;
    position: relative;
  }
  .form-row::after {
    content: "";
    position: absolute;
    left: 16px;
    right: 0;
    bottom: 0;
    height: 1px;
    background: #f0f0f0;
    transform: scaleY(0.5);
  }
  .form-row:last-child::after { display: none; }
  .form-row .label {
    font-size: 16px;
    color: #000;
    flex-shrink: 0;
    line-height: 1.4;
  }
  .form-row .label .req {
    color: #fa5151;
    margin-right: 1px;
  }
  .form-row .label .sub {
    display: block;
    font-size: 15px;
  }
  .form-row .value-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    text-align: right;
    min-width: 0;
  }
  .form-row .value {
    font-size: 16px;
    color: #000;
  }
  .form-row .value.placeholder { color: #b8b8b8; }
  .form-row .value.input-like {
    color: #b8b8b8;
    border: none;
    outline: none;
    background: transparent;
    text-align: right;
    font-family: inherit;
    width: 180px;
  }
  .form-row .chevron {
    margin-left: 6px;
    flex-shrink: 0;
  }
  .form-row.clickable { cursor: pointer; }
  .form-row.clickable:active { background: #fafafa; }

  /* 子行（借记卡/贷记卡） */
  .sub-rows { background: #fff; }
  .sub-row {
    display: flex;
    align-items: center;
    min-height: 46px;
    padding: 8px 16px 8px 34px;
    position: relative;
  }
  .sub-row::after {
    content: "";
    position: absolute;
    left: 34px;
    right: 0;
    bottom: 0;
    height: 1px;
    background: #f0f0f0;
    transform: scaleY(0.5);
  }
  .sub-row:last-child::after { display: none; }
  .sub-row .label { font-size: 15px; color: #000; }
  .sub-row .value { margin-left: auto; font-size: 16px; color: #000; }

  /* 费率行数值输入 */
  .rate-value {
    border: none;
    outline: none;
    background: transparent;
    text-align: right;
    font-size: 16px;
    color: #000;
    font-family: inherit;
    width: 90px;
  }

  /* 组标签（借/贷 (%) 等） */
  .group-label {
    margin-left: 12px;
    font-size: 15px;
    color: #000;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="phone">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span>07:24</span>
    <div class="status-right">
      <svg width="18" height="12" viewBox="0 0 18 12">
        <rect x="0" y="7" width="3" height="5" rx="1" fill="#000"/>
        <rect x="5" y="5" width="3" height="7" rx="1" fill="#000"/>
        <rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#000"/>
        <rect x="15" y="0" width="3" height="12" rx="1" fill="#000"/>
      </svg>
      <svg width="17" height="12" viewBox="0 0 17 12">
        <path d="M8.5 9.5a2.2 2.2 0 0 1 2.2 2.2L8.5 12l-2.2-.3a2.2 2.2 0 0 1 2.2-2.2z" fill="#000"/>
        <path d="M8.5 5.6c1.9 0 3.6.7 4.9 1.9l-1.5 1.5a4.9 4.9 0 0 0-6.8 0L3.6 7.5a7 7 0 0 1 4.9-1.9z" fill="#000"/>
        <path d="M8.5 1.5c3 0 5.7 1.2 7.7 3.1l-1.5 1.5A8.9 8.9 0 0 0 8.5 3.6c-2.4 0-4.6.9-6.2 2.5L.8 4.6a10.9 10.9 0 0 1 7.7-3.1z" fill="#000"/>
      </svg>
      <span class="battery-num">85</span>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="nav-back" onclick="history.back()">
      <svg width="11" height="19" viewBox="0 0 11 19">
        <path d="M9.5 1.5 2 9.5l7.5 8" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="nav-title">补充信息</div>
  </div>

  <!-- 机构信息 -->
  <div class="section">
    <div class="section-head">
      <div class="bar"></div>
      <div class="title">机构信息</div>
    </div>
    <div class="card">
      <div class="form-row clickable" id="rowSignEntity">
        <div class="label"><span class="req">*</span>签约主体</div>
        <div class="value-wrap">
          <span class="value" id="signEntityValue">天阙</span>
          <svg class="chevron" width="8" height="14" viewBox="0 0 8 14">
            <path d="M1 1l6 6-6 6" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="form-row clickable">
        <div class="label"><span class="req">*</span>机构类型</div>
        <div class="value-wrap">
          <span class="value placeholder">请选择</span>
          <svg class="chevron" width="8" height="14" viewBox="0 0 8 14">
            <path d="M1 1l6 6-6 6" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="form-row clickable">
        <div class="label"><span class="req">*</span>业务类型</div>
        <div class="value-wrap">
          <span class="value placeholder">请选择</span>
          <svg class="chevron" width="8" height="14" viewBox="0 0 8 14">
            <path d="M1 1l6 6-6 6" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="form-row">
        <div class="label"><span class="req">*</span>品牌名称</div>
        <div class="value-wrap">
          <input class="value input-like" type="text" placeholder="品牌名称">
        </div>
      </div>
      <div class="form-row">
        <div class="label"><span class="req">*</span>双方合作区域</div>
        <div class="value-wrap">
          <input class="value input-like" type="text" placeholder="协议中展示的地区">
        </div>
      </div>
      <div class="form-row clickable">
        <div class="label"><span class="req">*</span>是否修改协议</div>
        <div class="value-wrap">
          <span class="value">否</span>
          <svg class="chevron" width="8" height="14" viewBox="0 0 8 14">
            <path d="M1 1l6 6-6 6" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="form-row clickable">
        <div class="label"><span class="req">*</span>是否申请微信渠道号</div>
        <div class="value-wrap">
          <span class="value">是</span>
          <svg class="chevron" width="8" height="14" viewBox="0 0 8 14">
            <path d="M1 1l6 6-6 6" stroke="#c8c8c8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- 签约费率 -->
  <div class="section">
    <div class="section-head">
      <div class="bar"></div>
      <div class="title">签约费率</div>
      <div class="extra">
        <span class="text">精简版</span>
        <div class="switch" id="rateModeSwitch"></div>
      </div>
    </div>
    <div class="card" style="margin-top:2px;">
      <div class="form-row" style="min-height:48px;">
        <div class="label" style="font-weight:400;">线下费率</div>
      </div>
    </div>
    <div class="card" style="margin-top:2px;">
      <div class="form-row">
        <div class="label"><span class="req">*</span>微信支付</div>
        <div class="group-label">借/贷&nbsp;(%)</div>
        <div class="value-wrap"><input class="rate-value" type="text" value="0.23"></div>
      </div>
      <div class="form-row">
        <div class="label"><span class="req">*</span>支付宝支付</div>
        <div class="group-label">借/贷&nbsp;(%)</div>
        <div class="value-wrap"><input class="rate-value" type="text" value="0.23"></div>
      </div>
      <div class="form-row">
        <div class="label"><span class="req">*</span>银联二维码<br><span class="sub">≤1000(%)</span></div>
        <div class="value-wrap"><input class="rate-value" type="text" value="0.23"></div>
      </div>
      <div class="form-row" style="padding-bottom:0;">
        <div class="label"><span class="req">*</span>银联二维码<br><span class="sub">&gt;1000(%)</span></div>
      </div>
      <div class="sub-rows">
        <div class="sub-row">
          <div class="label">借记卡&nbsp;(%)</div>
          <div class="value"><input class="rate-value" type="text" value="0.23" style="width:80px;"></div>
        </div>
        <div class="sub-row">
          <div class="label">贷记卡&nbsp;(%)</div>
          <div class="value"><input class="rate-value" type="text" value="0.535" style="width:80px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ===== 签约主体联动 =====
  // 点击「签约主体」行 → 跳转签约主体多选页
  document.getElementById('rowSignEntity').addEventListener('click', function () {
    location.href = 'sign-entity-v2.html';
  });

  // 返回本页时读取勾选结果回填（无记录时默认展示天阙）
  function renderSignEntity() {
    var picked = null;
    try { picked = JSON.parse(localStorage.getItem('signEntities')); } catch (e) {}
    if (!Array.isArray(picked)) picked = ['天阙'];
    var el = document.getElementById('signEntityValue');
    if (picked && picked.length) {
      el.textContent = picked.join('、');
      el.classList.remove('placeholder');
    } else {
      el.textContent = '请选择';
      el.classList.add('placeholder');
    }
  }
  renderSignEntity();

  // ===== 精简版开关（演示切换） =====
  document.getElementById('rateModeSwitch').addEventListener('click', function () {
    this.classList.toggle('off');
  });
</script>
</body>
</html>
