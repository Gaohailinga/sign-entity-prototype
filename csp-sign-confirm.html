<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签署协议</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; padding: 24px; }
  .container { max-width: 1000px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 16px; color: #333; }
  .header .welcome { font-weight: 500; }
  .header .manager { color: #666; }
  .header .manager strong { color: #333; font-weight: 500; }
  .steps { display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 8px; padding: 32px 20px; margin-bottom: 20px; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #666; }
  .step .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #c0c4cc; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #999; }
  .step.active { color: #409eff; font-weight: 500; }
  .step.active .dot { border-color: #409eff; background: #409eff; color: #fff; }
  .step.done { color: #409eff; }
  .step.done .dot { border-color: #409eff; background: #fff; color: #409eff; }
  .step.done .dot::after { content: "✓"; font-size: 14px; font-weight: 700; }
  .step-line { width: 80px; height: 1px; background: #d9d9d9; margin: 0 12px; }
  .card { background: #fff; border-radius: 8px; padding: 28px; margin-bottom: 20px; }
  .card-title { font-size: 16px; font-weight: 600; color: #333; text-align: center; margin-bottom: 20px; }
  .agreement-wrap { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .agreement-section { border: 1px solid #ebeef5; border-radius: 6px; padding: 12px 14px; background: #fff; margin-bottom: 0; }
  .group-title { font-size: 14px; font-weight: 600; color: #303133; margin-bottom: 8px; }
  .agreement-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; color: #606266; }
  .agreement-item:last-child { border-bottom: none; padding-bottom: 0; }
  .agreement-item:first-child { padding-top: 0; }
  .agreement-name { color: #333; }
  .agreement-item a { color: #409eff; text-decoration: none; font-size: 12px; }
  .agreement-item a:hover { text-decoration: underline; }
  .status { color: #909399; font-size: 12px; margin-right: 8px; }
  @media (max-width: 640px) { .agreement-wrap { grid-template-columns: 1fr; } }
  .fee-title { font-size: 16px; font-weight: 600; color: #303133; text-align: left; margin-bottom: 16px; }
  .fee-groups { display: flex; flex-direction: column; gap: 12px; }
  .fee-group { border: 1px solid #e4e7ed; border-radius: 3px; overflow: hidden; background: #fff; }
  .fee-group-header { width: 100%; height: 44px; padding: 0 20px; border: 0; background: #fafafa; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 500; color: #303133; text-align: left; }
  .fee-group-header:hover { background: #f5f7fa; }
  .fee-group-header[aria-expanded="true"] { border-bottom: 1px solid #e4e7ed; }
  .fee-group-content { padding: 26px; overflow-x: auto; }
  .fee-group-content[hidden] { display: none; }
  .toggle-control { display: inline-flex; align-items: center; gap: 14px; color: #606266; font-size: 13px; font-weight: 400; flex: none; }
  .chevron { width: 8px; height: 8px; border-right: 1.5px solid #606266; border-bottom: 1.5px solid #606266; transform: rotate(45deg); margin-top: -4px; }
  .fee-group-header[aria-expanded="true"] .chevron { transform: rotate(225deg); margin-top: 4px; }
  .rate-table { width: 100%; min-width: 600px; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
  .rate-table th, .rate-table td { border: 1px solid #e5e7eb; padding: 13px 18px; height: 52px; vertical-align: middle; }
  .rate-table th { background: #fafafa; color: #303133; font-weight: 600; text-align: center; }
  .rate-table td { color: #606266; text-align: left; font-variant-numeric: tabular-nums; }
  .product-name { color: #303133; overflow-wrap: anywhere; }
  .action-bar { text-align: center; padding: 10px 0 30px; }
  .btn-primary { display: inline-block; min-width: 160px; height: 42px; line-height: 42px; background: #409eff; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
  .btn-primary:hover { background: #66b1ff; }
  @media (max-width: 768px) {
    body { padding: 16px; }
    .step-line { width: 30px; margin: 0 6px; }
    .rate-table { font-size: 12px; }
    .rate-table th, .rate-table td { padding: 10px 12px; }
    .fee-group-header { padding: 0 14px; }
    .fee-group-content { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="welcome">欢迎加入天阙会生活！</div>
    <div class="manager">您的合作经理：<strong>测试-BD1</strong></div>
  </div>
  <div class="steps">
    <div class="step done"><span class="dot"></span>注册账号</div>
    <div class="step-line"></div>
    <div class="step done"><span class="dot"></span>填写资料</div>
    <div class="step-line"></div>
    <div class="step done"><span class="dot"></span>信息审核</div>
    <div class="step-line"></div>
    <div class="step active"><span class="dot">4</span>签署协议</div>
  </div>
  <div class="card">
    <div class="card-title">签署协议——线上电子签约，完成后可下载电子协议，快速方便</div>
    <div class="agreement-wrap">
      <div class="agreement-section" id="tianqueGroup">
        <div class="group-title">北京天阙科技有限公司</div>
        <div class="agreement-item">
          <span class="agreement-name">合作服务协议</span>
          <span><span class="status">未签署</span><a href="#" download>下载</a></span>
        </div>
        <div class="agreement-item">
          <span class="agreement-name">补充协议</span>
          <span><span class="status">未签署</span><a href="#" download>下载</a></span>
        </div>
      </div>
      <div class="agreement-section" id="suixingfuGroup">
        <div class="group-title">随行付支付有限公司</div>
        <div class="agreement-item">
          <span class="agreement-name">外包服务协议</span>
          <span><span class="status">未签署</span><a href="#" download>下载</a></span>
        </div>
        <div class="agreement-item">
          <span class="agreement-name">补充协议</span>
          <span><span class="status">未签署</span><a href="#" download>下载</a></span>
        </div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="fee-title">费率信息</div>
    <div class="fee-groups" id="feeGroups"></div>
  </div>
  <div class="action-bar">
    <button class="btn-primary" id="signBtn">立即签约</button>
  </div>
</div>
<script>
  var cardCostColumns = ['借记卡费率（%）', '贷记卡费率（%）'];
  var cardCapCostColumns = ['借记卡费率（%）', '贷记卡费率（%）', '借记卡封顶（元）'];
  var valueAddedCostColumns = ['费率（%）', '保底服务费（元）', '封顶服务费（元）'];
  var feeGroupData = [
    {
      id: 'scanRates', title: '扫码收款签约费率', columns: cardCostColumns,
      rows: [
        ['微信', '0.23', '0.23'],
        ['支付宝', '0.23', '0.23'],
        ['银联单笔≤1000元', '0.23', '0.23'],
        ['银联单笔>1000元', '0.23', '0.54'],
        ['抖音', '0.23', '0.23'],
        ['翼支付', '0.23', '0.23'],
        ['京东白条分期', '0.54', '--'],
        ['订单支付', '0.10', '--']
      ]
    },
    {
      id: 'bankCardRates', title: '银行卡收款签约费率', columns: cardCapCostColumns,
      rows: [
        ['银联卡', '0.30', '0.30', '18.00'],
        ['手机闪付', '0.52', '0.52', '--']
      ]
    },
    {
      id: 'onlineRates', title: '线上场景收款签约费率', columns: cardCostColumns,
      rows: [
        ['微信', '0.68', '0.68'],
        ['支付宝', '0.68', '0.68'],
        ['银联单笔≤1000元', '0.68', '0.68'],
        ['银联单笔>1000元', '0.68', '0.68']
      ]
    },
    {
      id: 'smartMarketingRates', title: '智慧营销收款签约费率', columns: cardCostColumns,
      rows: [
        ['微信（智慧营销）', '0.21', '0.21'],
        ['支付宝（智慧营销）', '0.21', '0.21']
      ]
    },
    {
      id: 'specialRates', title: '特殊行业签约费率', columns: cardCostColumns,
      rows: [
        ['微信贷记卡-行业类10', '--', '0.23'],
        ['微信（保险类）', '0.80', '0.90'],
        ['微信（缴费类）', '0.10', '0.10'],
        ['微信（私立院校）', '0.60', '0.60'],
        ['微信（非盈利）', '0.13', '0.11'],
        ['支付宝（非盈利）', '0.15', '0.11']
      ]
    },
    {
      id: 'campaignRates', title: '营销活动签约费率', columns: cardCostColumns,
      rows: [
        ['教培机构', '0.38', '0.38'],
        ['未来校园', '0.00', '0.00'],
        ['高校食堂（学校主体）', '0.00', '0.00'],
        ['高校食堂（非学校主体）', '0.20', '0.20'],
        ['微信停车缴费', '0.38', '0.38'],
        ['商业医疗活动', '0.39', '0.39'],
        ['微信B2b', '0.25', '0.25'],
        ['芝麻信用分', '0.11', '0.11'],
        ['芝麻信用分活动', '0.11', '0.11']
      ]
    },
    {
      id: 'foreignRates', title: '外卡收款签约费率', columns: cardCapCostColumns,
      rows: [
        ['VISA-EDC', '3.00', '--', '--'],
        ['VISA-DCC', '1.1555', '--', '--'],
        ['万事达-EDC', '1.85', '--', '--'],
        ['万事达-DCC', '1.00', '--', '--'],
        ['运通AMEX-境内', '3.00', '3.1234', '18.75'],
        ['运通AMEX-境外非酒店类', '1.85', '--', '--']
      ]
    },
    {
      id: 'foreignSpecialRates', title: '外卡特殊费率', columns: cardCostColumns,
      rows: [
        ['VISA-酒旅类-EDC', '3.5555', '--'],
        ['VISA-酒旅类-DCC', '1.1555', '--'],
        ['万事达-酒旅类-EDC', '6.00', '--'],
        ['万事达-酒旅类-DCC', '1.00', '--'],
        ['运通AMEX-境外酒店类', '5.00', '--']
      ]
    },
    {
      id: 'valueAddedRates', title: '增值产品签约费率', columns: valueAddedCostColumns,
      rows: [
        ['订单分账服务费', '0.10', '0.00', '99999.99'],
        ['订单分账资金管理费', '0.10', '--', '--'],
        ['余额分账服务费', '0.00', '0.00', '0.00'],
        ['余额分账资金管理费', '0.00', '--', '--'],
        ['提现-当日到账', '0.20', '0.00', '99999.00'],
        ['提现-次日到账', '--', '--', '--'],
        ['提现-历史余额提现', '--', '--', '--'],
        ['定时到账', '0.0215', '0.00', '--']
      ]
    }
  ];
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char];
    });
  }
  function renderFeeGroups() {
    var visibleFeeGroups = feeGroupData.filter(function (group) {
      return Array.isArray(group.rows) && group.rows.some(function (row) {
        var productType = row[0];
        return productType !== undefined && productType !== null && String(productType).trim() !== '';
      });
    });
    document.getElementById('feeGroups').innerHTML = visibleFeeGroups.map(function (group) {
      var expanded = group.id === 'scanRates';
      var costWidth = 72 / group.columns.length;
      var colgroup = '<col style="width:28%">' + group.columns.map(function () {
        return '<col style="width:' + costWidth + '%">';
      }).join('');
      var subHeaders = group.columns.map(function (column) {
        return '<th>' + escapeHtml(column) + '</th>';
      }).join('');
      var bodyRows = group.rows.map(function (row) {
        return '<tr>' + row.map(function (cell, cellIndex) {
          return '<td' + (cellIndex === 0 ? ' class="product-name"' : '') + '>' + escapeHtml(cell) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return '<section class="fee-group">' +
        '<button type="button" class="fee-group-header collapsible" data-target="' + group.id + '" aria-expanded="' + expanded + '" aria-controls="' + group.id + '">' +
          escapeHtml(group.title) + '<span class="toggle-control"><span class="toggle-text">' + (expanded ? '收起' : '展示') + '</span><span class="chevron"></span></span>' +
        '</button>' +
        '<div class="fee-group-content" id="' + group.id + '"' + (expanded ? '' : ' hidden') + '>' +
          '<table class="rate-table"><colgroup>' + colgroup + '</colgroup>' +
            '<thead><tr><th rowspan="2">产品类型</th><th colspan="' + group.columns.length + '">签约成本</th></tr><tr>' + subHeaders + '</tr></thead>' +
            '<tbody>' + bodyRows + '</tbody>' +
          '</table>' +
        '</div>' +
      '</section>';
    }).join('');
  }
  renderFeeGroups();
  document.getElementById('signBtn').addEventListener('click', function () {
    location.href = 'https://www.example.com/sign';
  });
  document.querySelectorAll('.collapsible').forEach(function (el) {
    el.addEventListener('click', function () {
      var target = document.getElementById(this.getAttribute('data-target'));
      var isExpanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!isExpanded));
      target.hidden = isExpanded;
      this.querySelector('.toggle-text').textContent = isExpanded ? '展示' : '收起';
    });
  });
  var picked = [];
  try { picked = JSON.parse(localStorage.getItem('signEntities')) || []; } catch (e) {}
  var tqGroup = document.getElementById('tianqueGroup');
  var sxfGroup = document.getElementById('suixingfuGroup');
  if (picked.length) {
    tqGroup.style.display = picked.indexOf('天阙') > -1 ? '' : 'none';
    sxfGroup.style.display = picked.indexOf('随行付') > -1 ? '' : 'none';
    if (picked.length < 2) { document.querySelector('.agreement-wrap').style.gridTemplateColumns = '1fr'; }
  }
</script>
</body>
</html>
